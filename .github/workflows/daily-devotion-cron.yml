name: Daily Devotion Generator

on:
  schedule:
    # 11:00 UTC = 6:00 AM EST (Nov-Mar)
    # 10:00 UTC = 6:00 AM EDT (Mar-Nov)
    # Both run daily; generation is idempotent per ET day (second call returns
    # already_exists), and the push step only fires when fresh content was created.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily content generation
        id: generate
        run: |
          echo "Triggering daily devotion generation at $(date -u)"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "X-CRON-SECRET: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://benedictionspartagees.org/api/devotion/generate)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Success!"
            GEN_STATUS=$(echo "$BODY" | jq -r '.status // empty')
            echo "gen_status=$GEN_STATUS" >> "$GITHUB_OUTPUT"
          else
            echo "Failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Send daily push notifications
        if: steps.generate.outputs.gen_status == 'created'
        run: |
          echo "Sending daily push notifications at $(date -u)"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "X-CRON-SECRET: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://benedictionspartagees.org/api/push/send-today)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Push notifications sent!"
          else
            echo "Push failed with status $HTTP_CODE (non-fatal)"
          fi
